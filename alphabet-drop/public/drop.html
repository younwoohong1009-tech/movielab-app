<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>ALPHABET DROP — 혜택 쟁탈전</title>

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Inline critical styles for instant dark render */
    html { background: #0A0A0A; }
    #root { min-height: 100vh; }

    /* Loading state */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0A0A0A;
      color: #fff;
    }
    .loading-screen .logo-big {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .loading-screen .logo-big span { color: #FF6B00; }
    .loading-screen .loading-bar {
      width: 200px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-screen .loading-bar-fill {
      height: 100%;
      background: #FF6B00;
      animation: loadFill 1.5s ease-out forwards;
    }
    @keyframes loadFill {
      0% { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading state shown before React mounts -->
    <div class="loading-screen">
      <div class="logo-big">ALPHABET<span> DROP</span></div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
