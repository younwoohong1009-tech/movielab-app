<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WELCOME TO ALPHABET LIFE</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#000;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#intro{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;z-index:10}
.intro-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(3rem,8vw,7.5rem);text-transform:uppercase;letter-spacing:.04em;line-height:1.08;text-align:center}
#cinematic{position:relative;width:100%;height:100vh;overflow:hidden;z-index:5}
.cin-layer{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;will-change:transform,opacity}
/* <!-- BG1: 황야 사막 배경 --> */
.bg-desert{background-image:url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=2400&q=85');transform-origin:65% 80%}
.bg-desert::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.5)100%)}
/* <!-- BG2: 웨스턴풍 나무 오두막 외관 --> */
.bg-exterior{background-image:url('https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=2400&q=85');transform-origin:50% 55%;opacity:0}
/* <!-- BG3: 어두운 빈티지 나무 판자 벽면 --> */
.bg-interior{background-image:url('https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=2400&q=85');opacity:0}
.bg-interior::after{content:'';position:absolute;inset:0;background:rgba(5,3,0,.75)}
.cin-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;pointer-events:none}
.cin-text h2{font-weight:900;font-size:clamp(1.3rem,3.2vw,2.8rem);letter-spacing:.05em;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.85),0 0 80px rgba(0,0,0,.6);line-height:1.6}
.cin-black{position:absolute;inset:0;background:#000;opacity:0;z-index:3;pointer-events:none}
.card-wall{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;padding:2vh 4vw}
.wall-copy{text-align:center;margin-bottom:6px;opacity:0;transform:translateY(20px)}
.wall-copy p{font-size:clamp(.82rem,1.6vw,1.2rem);font-weight:300;line-height:2;color:rgba(255,255,255,.8);letter-spacing:.03em}
.wall-copy strong{font-weight:700;color:#fff}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,22px);max-width:820px;width:100%;margin-top:clamp(12px,2vh,28px)}
@media(max-width:700px){.card-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card-wrap{text-align:center}
.card-plate{aspect-ratio:.628;border-radius:12px;position:relative;cursor:pointer;overflow:hidden;opacity:0;transform:translateY(40px);
  transition:transform .35s cubic-bezier(.25,.8,.25,1),box-shadow .35s ease;
  box-shadow:4px 6px 20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.08)}
.card-plate:hover{transform:translateY(-6px) scale(1.03)!important;box-shadow:0 0 30px rgba(255,255,255,.12),0 0 60px rgba(120,140,255,.08),6px 20px 50px rgba(0,0,0,.9)}
.card-plate .card-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card-letter{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(3rem,7vw,5.5rem);color:rgba(255,255,255,.15);pointer-events:none}
.card-badge{position:absolute;top:6%;left:6%;z-index:5;padding:2px 6px;border:1.2px solid rgba(255,255,255,.45);border-radius:4px;font-size:clamp(5px,1.2vw,7px);font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.03em;pointer-events:none}
.card-label{margin-top:8px;font-family:'Oswald',sans-serif;font-size:clamp(8px,1.1vw,12px);font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.45);text-transform:uppercase}
.card-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.card-overlay.active{pointer-events:auto;opacity:1}
.card-overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card-popup{position:relative;z-index:2;width:min(280px,68vw);aspect-ratio:.628;border-radius:16px;overflow:hidden;transform:scale(.6) rotateY(15deg);opacity:0}
.card-popup .card-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card-popup .card-letter{font-size:6rem;color:rgba(255,255,255,.2)}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(3) rotate(-15deg);opacity:0;z-index:10;pointer-events:none}
.stamp-inner{width:150px;height:150px;border:5px solid #ff3333;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff3333;font-family:'Oswald',sans-serif;position:relative}
.stamp-inner::before{content:'';position:absolute;inset:6px;border:2px solid #ff3333;border-radius:50%}
.light-burst{position:absolute;top:50%;left:50%;width:500px;height:500px;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(255,220,100,.4)0%,transparent 60%);border-radius:50%}
.particles-box{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;top:50%;left:50%;opacity:0}
.popup-close{position:absolute;top:24px;right:24px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#events{position:relative;z-index:6;background:linear-gradient(180deg,#08080f,#0d0d1a);padding:clamp(60px,10vh,120px) 5vw}
.ev-title{font-family:'Oswald',sans-serif;font-size:clamp(1.5rem,3.5vw,3rem);font-weight:700;text-align:center;letter-spacing:.15em;text-transform:uppercase;margin-bottom:clamp(30px,5vh,60px);color:rgba(255,255,255,.9)}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:1100px;margin:0 auto}
.ev-card{border-radius:16px;padding:clamp(24px,4vw,44px);min-height:180px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(30px)}
.ev-card h3{font-family:'Oswald',sans-serif;font-size:clamp(1rem,1.8vw,1.3rem);font-weight:600;letter-spacing:.08em;margin-bottom:10px;color:rgba(255,255,255,.85)}
.ev-card p{font-size:clamp(.8rem,1.3vw,.95rem);font-weight:300;line-height:1.8;color:rgba(255,255,255,.4)}
.ev-tag{display:inline-block;margin-top:14px;padding:3px 12px;border:1px solid rgba(255,255,255,.12);border-radius:20px;font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,.35)}
footer{text-align:center;padding:50px 20px 36px;background:#08080f;color:rgba(255,255,255,.2);font-size:11px;letter-spacing:.06em}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
</style>
</head>
<body>
<section id="intro"><h1 class="intro-title">WELCOME TO<br>ALPHABET LIFE</h1></section>
<section id="cinematic">
  <div class="cin-layer bg-desert"></div>
  <div class="cin-layer bg-exterior"></div>
  <div class="cin-layer bg-interior"></div>
  <div class="cin-text" id="cinText"><h2>"알파벳 세상으로 넘어가는<br>출입국 사무소"</h2></div>
  <div class="cin-black" id="cinBlack"></div>
  <div class="card-wall" id="cardWall">
    <div class="wall-copy wc1"><p>새로운 알파벳 세상에 도착한 사람들에게</p></div>
    <div class="wall-copy wc2"><p><strong>알파벳 카드</strong>가 내 취향을 증명하는 카드가 되어</p></div>
    <div class="wall-copy wc3"><p>저마다의 라이프 혜택 안으로 들어가는 <strong>개별 스토리</strong></p></div>
    <div class="card-grid" id="cg"></div>
  </div>
</section>
<section id="events"><h2 class="ev-title">Alphabet Exclusive Events</h2><div class="ev-grid" id="eg"></div></section>
<div class="card-overlay" id="ov">
  <div class="card-overlay-bg"></div>
  <button class="popup-close" id="cb">&times;</button>
  <div class="card-popup" id="pu"></div>
  <div class="stamp" id="st"><div class="stamp-inner">
    <span style="font-size:20px;font-weight:700;letter-spacing:.15em">APPROVED</span>
    <span style="font-size:9px;letter-spacing:.2em;margin-top:2px">출입 승인</span>
    <span style="font-size:8px;margin-top:5px;color:#ff5555;letter-spacing:.1em">2026.04.13</span>
  </div></div>
  <div class="light-burst" id="lb"></div>
  <div class="particles-box" id="pc"></div>
</div>
<footer><p>WELCOME TO ALPHABET LIFE &mdash; Hyundai Card Alphabet Series</p></footer>
<script>
var D=[
  {l:'D',bg:'#2b2d7b',fg:'#f5b731',cat:'DINING'},
  {l:'H',bg:'#1c1c5e',fg:'#e85d2a',cat:'CAFE'},
  {l:'O',bg:'#6cb8e6',fg:'#4a5e1a',cat:'SHOPPING'},
  {l:'S',bg:'#f03c14',fg:'#7dd6a0',cat:'TRAVEL'},
  {l:'T',bg:'#1a7a8a',fg:'#c4956a',cat:'ENTERTAINMENT'},
  {l:'B',bg:'#f5b731',fg:'#e82e1e',cat:'MOBILITY'},
  {l:'P',bg:'#38d4d4',fg:'#5a1a3a',cat:'LIVING'},
  {l:'R',bg:'#e838ef',fg:'#33cc33',cat:'SUBCULTURE'}
];
var EV=[
  {t:'FIRST SWIPE BONUS',s:'첫 결제 시 캐시백 최대 50,000원',g:'신규 혜택'},
  {t:'CATEGORY BOOST',s:'선택 업종 추가 적립 최대 10%',g:'적립'},
  {t:'ANNIVERSARY REWARD',s:'연회비 결제 시 프리미엄 기프트 제공',g:'리워드'},
  {t:'DIGITAL LOUNGE',s:'알파벳 전용 온라인 라운지 초대',g:'멤버십'},
  {t:'TRAVEL PACKAGE',s:'제휴 호텔·항공 할인 및 라운지 이용',g:'여행'},
  {t:'CULTURE PASS',s:'전시·공연·영화 할인 및 얼리 액세스',g:'문화'}
];
function mkCard(c,i,pop){
  var h='<div class="card-bg" style="background:linear-gradient(135deg,'+c.bg+','+c.fg+')">';
  h+='<span class="card-letter">'+c.l+'</span></div>';
  if(!pop) h+='<span class="card-badge">Hyundai Card</span>';
  return h;
}
var cg=document.getElementById('cg');
D.forEach(function(c,i){
  var w=document.createElement('div');w.className='card-wrap';
  var p=document.createElement('div');p.className='card-plate';p.dataset.i=i;
  p.innerHTML=mkCard(c,i,false);
  var lb=document.createElement('div');lb.className='card-label';lb.textContent=c.cat;
  w.appendChild(p);w.appendChild(lb);cg.appendChild(w);
});
var eg=document.getElementById('eg');
EV.forEach(function(e){
  var d=document.createElement('div');d.className='ev-card';
  d.innerHTML='<h3>'+e.t+'</h3><p>'+e.s+'</p><span class="ev-tag">'+e.g+'</span>';
  eg.appendChild(d);
});
gsap.registerPlugin(ScrollTrigger);
gsap.to('.intro-title',{scale:1.3,opacity:0,ease:'power2.inOut',scrollTrigger:{trigger:'#intro',start:'top top',end:'bottom top',scrub:1}});
var tl=gsap.timeline({scrollTrigger:{trigger:'#cinematic',start:'top top',end:'+=6000',scrub:1.5,pin:true,anticipatePin:1}});
tl.to('.bg-desert',{scale:6,ease:'power1.in',duration:.25},0);
tl.to('#cinText',{opacity:0,scale:.8,duration:.1},.08);
tl.to('.bg-exterior',{opacity:1,duration:.12},.2);
tl.to('.bg-desert',{opacity:0,duration:.08},.25);
tl.to('.bg-exterior',{scale:4,duration:.2,ease:'power1.in'},.35);
tl.to('#cinBlack',{opacity:1,duration:.06},.5);
tl.to('.bg-interior',{opacity:1,duration:.01},.56);
tl.to('#cinBlack',{opacity:0,duration:.1},.58);
tl.to('#cardWall',{opacity:1,duration:.08},.65);
tl.to('.wc1',{opacity:1,y:0,duration:.06},.68);
tl.to('.wc2',{opacity:1,y:0,duration:.06},.72);
tl.to('.wc3',{opacity:1,y:0,duration:.06},.76);
document.querySelectorAll('.card-plate').forEach(function(p,i){
  tl.to(p,{opacity:1,y:0,duration:.04,ease:'back.out(1.4)'},.80+i*.02);
});
gsap.utils.toArray('.ev-card').forEach(function(el){
  gsap.to(el,{opacity:1,y:0,duration:.8,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 88%',toggleActions:'play none none reverse'}});
});
var ov=document.getElementById('ov'),pu=document.getElementById('pu'),st=document.getElementById('st'),lbEl=document.getElementById('lb'),pc=document.getElementById('pc');
var pC=['#ff3333','#f5a623','#4a8bc2','#3a7d44','#d946ef','#e6b800','#fff','#7c3aed'];
function openCard(i){
  var c=D[i];pu.innerHTML=mkCard(c,i,true);
  ov.classList.add('active');document.body.style.overflow='hidden';
  pc.innerHTML='';
  for(var j=0;j<30;j++){var p=document.createElement('div');p.className='particle';p.style.background=pC[j%8];var s=(3+Math.random()*5)+'px';p.style.width=s;p.style.height=s;pc.appendChild(p);}
  var t=gsap.timeline();
  t.to(ov,{opacity:1,duration:.4},0);
  t.to(pu,{scale:1,rotateY:0,opacity:1,duration:.7,ease:'back.out(1.7)'},.15);
  t.to(lbEl,{scale:1.2,opacity:1,duration:.5},.6);
  t.to(lbEl,{scale:1.8,opacity:0,duration:.8},1.1);
  t.to(st,{scale:1,rotate:-15,opacity:1,duration:.35,ease:'back.out(3)'},.85);
  pc.querySelectorAll('.particle').forEach(function(p){
    var a=Math.random()*Math.PI*2,d=120+Math.random()*200;
    t.to(p,{x:Math.cos(a)*d,y:Math.sin(a)*d,opacity:1,duration:.15},.85);
    t.to(p,{opacity:0,duration:.5},1.05);
  });
}
function closeCard(){
  var t=gsap.timeline({onComplete:function(){
    ov.classList.remove('active');document.body.style.overflow='';
    gsap.set(pu,{scale:.6,rotateY:15,opacity:0});
    gsap.set(st,{scale:3,rotate:-15,opacity:0});
    gsap.set(lbEl,{scale:0,opacity:0});
  }});
  t.to(st,{opacity:0,duration:.25},0);
  t.to(pu,{scale:.7,opacity:0,duration:.35},0);
  t.to(ov,{opacity:0,duration:.35},.1);
}
document.querySelectorAll('.card-plate').forEach(function(p){p.addEventListener('click',function(){openCard(+p.dataset.i)});});
document.getElementById('cb').addEventListener('click',closeCard);
document.querySelector('.card-overlay-bg').addEventListener('click',closeCard);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('active'))closeCard()});
</script>
</body>
</html>
