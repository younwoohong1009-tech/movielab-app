<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WELCOME TO ALPHABET LIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:#000;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* === INTRO === */
#intro{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;z-index:10}
.intro-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(3rem,8vw,7.5rem);text-transform:uppercase;letter-spacing:.04em;line-height:1.08;text-align:center;will-change:transform,opacity}

/* === CINEMATIC (pinned container for scenes 1-3) === */
#cinematic{position:relative;width:100%;height:100vh;overflow:hidden;z-index:5}
.cin-layer{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;will-change:transform,opacity}

/* <!-- BG1: 황야 사막 배경 이미지 --> */
.bg-desert{
  background-image:url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=2400&q=85');
  transform-origin:65% 80%;
}
.bg-desert::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.5)100%)}

/* <!-- BG2: 출입국 사무소 외관 이미지 --> */
.bg-exterior{
  background-image:url('https://images.unsplash.com/photo-1452421822248-d4c2b47f0c81?w=2400&q=85');
  transform-origin:50% 55%;
  opacity:0;
}

/* <!-- BG3: 사무소 내부 나무벽면 이미지 --> */
.bg-interior{
  background-image:url('https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=2400&q=85');
  opacity:0;
}
.bg-interior::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.65)}

.cin-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;pointer-events:none}
.cin-text h2{font-weight:900;font-size:clamp(1.3rem,3.2vw,2.8rem);letter-spacing:.05em;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.85),0 0 80px rgba(0,0,0,.6);line-height:1.6}
.cin-blackout{position:absolute;inset:0;background:#000;opacity:0;z-index:3;pointer-events:none}

/* === CARD WALL (inside cinematic) === */
.card-wall{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;padding:3vh 4vw}
.wall-copy{text-align:center;margin-bottom:clamp(16px,3vh,40px);opacity:0;transform:translateY(20px)}
.wall-copy p{font-size:clamp(.85rem,1.8vw,1.35rem);font-weight:300;line-height:2;color:rgba(255,255,255,.8);letter-spacing:.03em}
.wall-copy p strong{font-weight:700;color:#fff}

.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,24px);max-width:880px;width:100%}
@media(max-width:700px){.card-grid{grid-template-columns:repeat(2,1fr);gap:12px}}

/* === CARD PLATE === */
.card-plate{aspect-ratio:.628;border-radius:14px;position:relative;cursor:pointer;overflow:hidden;opacity:0;transform:translateY(40px);
  transition:transform .35s cubic-bezier(.25,.8,.25,1),box-shadow .35s ease;
  box-shadow:0 8px 32px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
.card-plate svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.card-badge{position:absolute;top:6%;left:6%;z-index:5;padding:2px 6px;border:1.2px solid rgba(255,255,255,.55);border-radius:4px;font-size:clamp(5px,1.3vw,8px);font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.03em;pointer-events:none}
.card-chip{position:absolute;top:11%;left:50%;transform:translateX(-50%);width:clamp(18px,4.5vw,30px);z-index:5;pointer-events:none}
.card-label{text-align:center;margin-top:8px;font-family:'Oswald',sans-serif;font-size:clamp(9px,1.2vw,13px);font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase}

.card-plate:hover{transform:translateY(-6px) scale(1.03)!important;box-shadow:0 0 25px rgba(255,255,255,.12),0 0 60px rgba(120,140,255,.08),0 20px 50px rgba(0,0,0,.6)}

/* === POPUP === */
.card-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.card-overlay.active{pointer-events:auto;opacity:1}
.card-overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card-popup{position:relative;z-index:2;width:min(300px,70vw);aspect-ratio:.628;border-radius:18px;overflow:hidden;transform:scale(.6) rotateY(15deg);opacity:0}
.card-popup svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(3) rotate(-15deg);opacity:0;z-index:10;pointer-events:none}
.stamp-inner{width:160px;height:160px;border:5px solid #ff3333;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff3333;font-family:'Oswald',sans-serif;position:relative}
.stamp-inner::before{content:'';position:absolute;inset:6px;border:2px solid #ff3333;border-radius:50%}
.light-burst{position:absolute;top:50%;left:50%;width:500px;height:500px;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(255,220,100,.4)0%,rgba(255,180,60,.1)30%,transparent 60%);border-radius:50%}
.particles-box{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;top:50%;left:50%;opacity:0}
.popup-close{position:absolute;top:24px;right:24px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s;backdrop-filter:blur(4px)}
.popup-close:hover{background:rgba(255,255,255,.15)}

/* === SCENE 4: EVENTS === */
#events{position:relative;z-index:6;background:linear-gradient(180deg,#08080f 0%,#0d0d1a 100%);padding:clamp(60px,10vh,120px) 5vw}
.ev-title{font-family:'Oswald',sans-serif;font-size:clamp(1.6rem,3.5vw,3rem);font-weight:700;text-align:center;letter-spacing:.15em;text-transform:uppercase;margin-bottom:clamp(30px,5vh,60px);color:rgba(255,255,255,.9)}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1100px;margin:0 auto}
.ev-card{border-radius:16px;padding:clamp(28px,4vw,48px);min-height:200px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(6px);opacity:0;transform:translateY(30px)}
.ev-card h3{font-family:'Oswald',sans-serif;font-size:clamp(1rem,2vw,1.4rem);font-weight:600;letter-spacing:.08em;margin-bottom:12px;color:rgba(255,255,255,.85)}
.ev-card p{font-size:clamp(.8rem,1.4vw,1rem);font-weight:300;line-height:1.8;color:rgba(255,255,255,.45)}
.ev-card .ev-tag{display:inline-block;margin-top:16px;padding:4px 14px;border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.4)}

footer{text-align:center;padding:50px 20px 36px;background:#08080f;color:rgba(255,255,255,.2);font-size:11px;letter-spacing:.06em}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
</style>
</head>
<body>

<!-- SVG defs -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#d4b85c"/><stop offset="45%" stop-color="#f0e0a0"/><stop offset="100%" stop-color="#b08a2e"/>
</linearGradient></defs>
</svg>

<!-- ====== SECTION 1: INTRO ====== -->
<section id="intro">
  <h1 class="intro-title">WELCOME TO<br>ALPHABET LIFE</h1>
</section>

<!-- ====== SECTIONS 2-3: CINEMATIC (pinned) ====== -->
<section id="cinematic">
  <div class="cin-layer bg-desert"></div>
  <div class="cin-layer bg-exterior"></div>
  <div class="cin-layer bg-interior"></div>
  <div class="cin-text" id="cinText"><h2>"알파벳 세상으로 넘어가는<br>출입국 사무소"</h2></div>
  <div class="cin-blackout" id="cinBlack"></div>
  <div class="card-wall" id="cardWall">
    <div class="wall-copy wc1"><p>새로운 알파벳 세상에 도착한 사람들에게</p></div>
    <div class="wall-copy wc2"><p><strong>알파벳 카드</strong>가 내 취향을 증명하는 카드가 되어</p></div>
    <div class="wall-copy wc3"><p>저마다의 라이프 혜택 안으로 들어가는 <strong>개별 스토리</strong></p></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
</section>

<!-- ====== SECTION 4: EVENTS ====== -->
<section id="events">
  <h2 class="ev-title">Alphabet Exclusive Events</h2>
  <div class="ev-grid" id="evGrid"></div>
</section>

<!-- ====== POPUP ====== -->
<div class="card-overlay" id="cardOverlay">
  <div class="card-overlay-bg"></div>
  <button class="popup-close" id="popupClose">&times;</button>
  <div class="card-popup" id="cardPopup"></div>
  <div class="stamp" id="stamp"><div class="stamp-inner">
    <span style="font-size:22px;font-weight:700;letter-spacing:.15em">APPROVED</span>
    <span style="font-size:10px;letter-spacing:.2em;margin-top:2px">출입 승인</span>
    <span style="font-size:9px;margin-top:6px;color:#ff5555;letter-spacing:.1em">2026.04.13</span>
  </div></div>
  <div class="light-burst" id="lightBurst"></div>
  <div class="particles-box" id="particles"></div>
</div>

<footer><p>WELCOME TO ALPHABET LIFE &mdash; Hyundai Card Alphabet Series</p></footer>

<script>
/* =========================================================
   DATA — 카드 8종 + 업종 라벨 + SVG path 정의
   ★ 실제 카드 이미지 교체 시: img 프로퍼티 추가 후
     renderCard() 함수에서 <img> 태그로 변경
========================================================= */
const C=[
  {l:'D',bg:'#2b2d7b',fg:'#f5b731',cat:'DINING',
   d:'M90 28L90 450L165 450C258 450 268 365 268 239C268 113 258 28 165 28Z'},
  {l:'H',bg:'#1c1c5e',fg:'#e85d2a',cat:'HOTEL',
   d:'M45 0h80v478H45zM175 0h80v478h-80zM45 185h210v108H45z'},
  {l:'O',bg:'#6cb8e6',fg:'#4a5e1a',cat:'ONLINE',
   d:'M150 65C230 65 278 145 278 260C278 375 230 455 150 455C70 455 22 375 22 260C22 145 70 65 150 65Z'},
  {l:'S',bg:'#f03c14',fg:'#7dd6a0',cat:'SHOPPING',
   d:'M185 115C280 50 310 190 200 200C90 210 60 320 170 370C280 420 240 470 115 365'},
  {l:'T',bg:'#1a7a8a',fg:'#c4956a',cat:'TRAVEL',
   d:'M0 0h300v165H0zM85 165h130v313H85z'},
  {l:'B',bg:'#f5b731',fg:'#e82e1e',cat:'BEAUTY',
   d:'M42 12L42 232L145 232C222 232 248 192 248 130C248 60 210 12 145 12ZM42 248L42 466L155 466C240 466 265 420 265 360C265 296 228 248 155 248Z'},
  {l:'P',bg:'#38d4d4',fg:'#5a1a3a',cat:'PET',
   d:'M55 75h65v390H55zM120 75L120 285C205 285 255 250 255 180C255 110 205 75 120 75Z'},
  {l:'R',bg:'#e838ef',fg:'#33cc33',cat:'RIDE',
   d:'M50 55h65v400H50zM115 55L115 265C200 265 252 228 252 160C252 92 200 55 115 55ZM135 265L262 455H192L115 300Z'}
];

const EVENTS=[
  {t:'FIRST SWIPE BONUS',s:'첫 결제 시 캐시백 최대 50,000원',tag:'신규 혜택'},
  {t:'CATEGORY BOOST',s:'선택 업종 추가 적립 최대 10%',tag:'적립'},
  {t:'ANNIVERSARY REWARD',s:'연회비 결제 시 프리미엄 기프트 제공',tag:'리워드'},
  {t:'DIGITAL LOUNGE',s:'알파벳 전용 온라인 라운지 초대',tag:'멤버십'},
  {t:'TRAVEL PACKAGE',s:'제휴 호텔·항공 할인 및 라운지 이용',tag:'여행'},
  {t:'CULTURE PASS',s:'전시·공연·영화 할인 및 얼리 액세스',tag:'문화'}
];

/* chip SVG */
const chip='<svg class="card-chip" viewBox="0 0 50 38" xmlns="http://www.w3.org/2000/svg"><rect width="50" height="38" rx="5" fill="url(#cg)"/><line x1="25" y1="0" x2="25" y2="38" stroke="#b08a2e" stroke-width=".7" opacity=".4"/><line x1="0" y1="14" x2="50" y2="14" stroke="#b08a2e" stroke-width=".7" opacity=".4"/><line x1="0" y1="24" x2="50" y2="24" stroke="#b08a2e" stroke-width=".7" opacity=".4"/></svg>';

function cardSVG(c){
  return `<svg viewBox="0 0 300 478" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="478" fill="${c.bg}"/><path d="${c.d}" fill="${c.fg}"/></svg>`;
}

/* Render card grid */
const grid=document.getElementById('cardGrid');
C.forEach((c,i)=>{
  const wrap=document.createElement('div');
  const plate=document.createElement('div');
  plate.className='card-plate';
  plate.dataset.i=i;
  plate.innerHTML=cardSVG(c)+'<span class="card-badge">Hyundai Card</span>'+chip;
  const lbl=document.createElement('div');
  lbl.className='card-label';
  lbl.textContent=c.cat;
  wrap.appendChild(plate);
  wrap.appendChild(lbl);
  grid.appendChild(wrap);
});

/* Render events */
const evg=document.getElementById('evGrid');
EVENTS.forEach(e=>{
  const d=document.createElement('div');
  d.className='ev-card';
  d.innerHTML=`<h3>${e.t}</h3><p>${e.s}</p><span class="ev-tag">${e.tag}</span>`;
  evg.appendChild(d);
});

/* =========================================================
   GSAP TIMELINE
========================================================= */
gsap.registerPlugin(ScrollTrigger);

/* 1. Intro fade */
gsap.to('.intro-title',{
  scale:1.3,opacity:0,ease:'power2.inOut',
  scrollTrigger:{trigger:'#intro',start:'top top',end:'bottom top',scrub:1}
});

/* 2-3. Cinematic pinned sequence */
const tl=gsap.timeline({
  scrollTrigger:{
    trigger:'#cinematic',
    start:'top top',
    end:'+=6000',
    scrub:1.5,
    pin:true,
    anticipatePin:1
  }
});

/* Phase A: 황야 줌인 (0 → 0.25) */
tl.to('.bg-desert',{scale:6,ease:'power1.in',duration:.25},0);
tl.to('#cinText',{opacity:0,scale:.8,duration:.1},0.08);

/* Phase B: 사무소 외관 크로스페이드 등장 (0.2 → 0.35) */
tl.to('.bg-exterior',{opacity:1,duration:.12},.2);
tl.to('.bg-desert',{opacity:0,duration:.08},.25);

/* Phase C: 외관 줌인 → 문 안으로 (0.35 → 0.55) */
tl.to('.bg-exterior',{scale:4,duration:.2,ease:'power1.in'},.35);
tl.to('#cinBlack',{opacity:1,duration:.06},.5);

/* Phase D: 내부 등장 + 블랙아웃 해제 (0.55 → 0.7) */
tl.to('.bg-interior',{opacity:1,duration:.01},.56);
tl.to('#cinBlack',{opacity:0,duration:.1},.58);

/* Phase E: 카드 월 등장 (0.65 → 1.0) */
tl.to('#cardWall',{opacity:1,duration:.08},.65);
tl.to('.wc1',{opacity:1,y:0,duration:.06},.68);
tl.to('.wc2',{opacity:1,y:0,duration:.06},.72);
tl.to('.wc3',{opacity:1,y:0,duration:.06},.76);

/* 카드 순차 등장 */
document.querySelectorAll('.card-plate').forEach((p,i)=>{
  tl.to(p,{opacity:1,y:0,duration:.04,ease:'back.out(1.4)'},.80+i*.02);
});

/* Scene 4: events scroll-in */
gsap.utils.toArray('.ev-card').forEach(el=>{
  gsap.to(el,{opacity:1,y:0,duration:.8,ease:'power3.out',
    scrollTrigger:{trigger:el,start:'top 88%',toggleActions:'play none none reverse'}
  });
});

/* =========================================================
   CARD POPUP
========================================================= */
const ov=document.getElementById('cardOverlay');
const pu=document.getElementById('cardPopup');
const st=document.getElementById('stamp');
const lb=document.getElementById('lightBurst');
const pc=document.getElementById('particles');
const pColors=['#ff3333','#f5a623','#4a8bc2','#3a7d44','#d946ef','#e6b800','#fff','#7c3aed'];

function openCard(i){
  const c=C[i];
  pu.innerHTML=cardSVG(c)+'<span class="card-badge" style="padding:4px 10px;font-size:11px">Hyundai Card</span>'+chip;
  ov.classList.add('active');
  document.body.style.overflow='hidden';
  pc.innerHTML='';
  for(let j=0;j<36;j++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=pColors[j%8];
    const s=(3+Math.random()*5)+'px';
    p.style.width=s;p.style.height=s;
    pc.appendChild(p);
  }
  const t=gsap.timeline();
  t.to(ov,{opacity:1,duration:.4},0);
  t.to(pu,{scale:1,rotateY:0,opacity:1,duration:.7,ease:'back.out(1.7)'},.15);
  t.to(lb,{scale:1.2,opacity:1,duration:.5},.6);
  t.to(lb,{scale:1.8,opacity:0,duration:.8},1.1);
  t.to(st,{scale:1,rotate:-15,opacity:1,duration:.35,ease:'back.out(3)'},.85);
  pc.querySelectorAll('.particle').forEach(p=>{
    const a=Math.random()*Math.PI*2,d=120+Math.random()*220;
    t.to(p,{x:Math.cos(a)*d,y:Math.sin(a)*d,opacity:1,duration:.15},.85);
    t.to(p,{opacity:0,duration:.5+Math.random()*.4},1.05);
  });
}

function closeCard(){
  const t=gsap.timeline({onComplete:()=>{
    ov.classList.remove('active');
    document.body.style.overflow='';
    gsap.set(pu,{scale:.6,rotateY:15,opacity:0});
    gsap.set(st,{scale:3,rotate:-15,opacity:0});
    gsap.set(lb,{scale:0,opacity:0});
  }});
  t.to(st,{opacity:0,duration:.25},0);
  t.to(pu,{scale:.7,opacity:0,duration:.35},0);
  t.to(ov,{opacity:0,duration:.35},.1);
}

document.querySelectorAll('.card-plate').forEach(p=>{
  p.addEventListener('click',()=>openCard(+p.dataset.i));
});
document.getElementById('popupClose').addEventListener('click',closeCard);
document.querySelector('.card-overlay-bg').addEventListener('click',closeCard);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('active'))closeCard()});
</script>
</body>
</html>
